name: 'Dev Infrastructure Pipeline'

on:
  push:
    branches-ignore:
      - main       # Jab kisi bhi feature branch par code push ho
  pull_request:
    branches:
      - main       # Jab main branch ke liye PR open/update ho
  push:
    branches:
      - main       # Jab PR main me merge ho jaye

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: Feature Branch -> Init, Fmt, Validate, Plan & Auto PR
  # -------------------------------------------------------------
  terraform-plan:
    name: 'Terraform Plan & Auto PR'
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Environment/Dev_environment

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format Check
      run: terraform fmt -check

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan -no-color -input=false

    # Feature branch par push hone par automatic PR raise karna
    - name: Create Pull Request Automatically
      if: github.event_name == 'push'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref_name }}
        base: main
        title: "Automated PR: Terraform changes from ${{ github.ref_name }}"
        body: "Yeh PR automatic action dwara banayi gayi hai. Pre-checks (Init, Format, Validate, Plan) successfully pass ho chuke hain."

  # -------------------------------------------------------------
  # JOB 2: Main Branch -> Manual Approval & Apply
  # -------------------------------------------------------------
  terraform-apply:
    name: 'Terraform Apply (Main Branch)'
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # Yeh line Manual Approval ke liye zaroori hai

    defaults:
      run:
        working-directory: ./Environment/Dev_environment

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Terraform Init
      run: terraform init

    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false